services:
  mysql:
    image: mysql:8.0
    container_name: guildas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: guildas
    ports:
      - "3306:3306"
    volumes:
      - guildas-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  guildas-data:
